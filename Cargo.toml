[package]
name = "usbwatch"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Offline USB descriptor and recorded-session inspection"
license = "MIT"
repository = "https://github.com/joshiii-xyz/usbwatch"
keywords = ["usb", "descriptors", "hotplug", "inspection"]
categories = ["command-line-utilities", "hardware-support"]

[dependencies]
clap = { version = "4.5", features = ["derive"] }
hex = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
[dev-dependencies]
serde_json = "1.0"
